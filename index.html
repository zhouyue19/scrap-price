<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="format-detection" content="telephone=no"><title>成都废料回收报价</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#eef2f6;color:#111827;padding:12px 12px 32px;-webkit-text-size-adjust:100%;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
"Microsoft YaHei",sans-serif}
.hd{background:linear-gradient(135deg,#0f2b46,#1b4b74);border-radius:16px;padding:18px;
color:#fff;margin-bottom:12px}
.hd h1{font-size:21px;font-weight:700;letter-spacing:.5px}
.hd .d{font-size:13px;color:#9fb3c8;margin-top:6px}
.hd .f{font-size:11px;color:#7d93aa;margin-top:8px;text-align:right}
.warn{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px 12px;
font-size:13px;line-height:1.5;margin-bottom:12px}
.cu{background:#fff7ed;border-left:4px solid #c2410c;border-radius:12px;
padding:14px 14px 6px;margin-bottom:12px}
.cu h2{font-size:15px;color:#9a3412;font-weight:700;margin-bottom:10px}
.card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px;
box-shadow:0 1px 3px rgba(15,43,70,.06)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;color:#fff}
.sh b{font-size:15px;font-weight:700}.sh span{font-size:11px;opacity:.85}
.r{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;
border-bottom:1px solid #f3f4f6}
.r:last-child{border-bottom:0}
.n{font-size:14px;color:#111827}
.right{text-align:right;white-space:nowrap}
.p{font-size:17px;font-weight:700;color:#111827;font-variant-numeric:tabular-nums}
.p small{font-size:10px;font-weight:400;color:#9ca3af;margin-left:2px}
.c{font-size:11px;margin-left:6px}
.ton{display:block;font-size:10.5px;color:#9ca3af;margin-top:2px}
.mini{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px;
font-size:12px;color:#4b5563;line-height:1.9}
.mini b{color:#111827;font-size:13px;display:block;margin-bottom:6px}
.fut{display:flex;flex-wrap:wrap}
.fut div{width:50%;padding:6px 8px 6px 0;font-size:12.5px;display:flex;
justify-content:space-between}
.foot{font-size:11px;color:#9ca3af;line-height:1.8;margin-top:14px;padding:0 4px}
.up{color:#dc2626}.dn{color:#059669}.fl{color:#6b7280}
.load{text-align:center;color:#6b7280;font-size:13px;padding:30px 0}
.refresh{display:block;text-align:center;margin:16px auto 0;padding:11px;
background:#0f2b46;color:#fff;border-radius:10px;font-size:14px;text-decoration:none}
</style></head><body><div id="app"><div class="load">正在取今日报价…</div></div><script>
var API = "https://ntfy.sh/scrap_price_sichuan_2026/json?poll=1&since=12h";
function esc(s){return String(s).replace(/[&<>]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function num(v){ if(v===null||v===undefined||v===''||isNaN(v)) return '—';
  var n=Number(v);
  return Math.abs(n)>=1000 ? Math.round(n).toLocaleString('en-US')
                           : (Math.round(n*100)/100).toString(); }
function chg(r){
  if((r.dir!=='涨'&&r.dir!=='跌')&&(r.chg===null||r.chg===undefined||isNaN(r.chg))) return '';
  var c=Math.abs(Number(r.chg)||0), t, cl;
  if(r.dir==='涨'){t='▲'+num(c);cl='up';}
  else if(r.dir==='跌'){t='▼'+num(c);cl='dn';}
  else {t='持平';cl='fl';}
  return '<span class="c '+cl+'">'+t+'</span>';}
function rows(list, withTon){
  function rng(a,b){a=num(a);b=num(b);return a===b?a:(a+'–'+b);}
  var h='';
  for(var i=0;i<list.length;i++){var r=list[i];
    h+='<div class="r"><span class="n">'+esc(r.name)+'</span>'
      +'<span class="right"><span class="p">'+rng(r.low,r.high)
      +'<small>元/公斤</small></span>'+chg(r)
      +(withTon?('<span class="ton">'+rng(r.low_t!==undefined?r.low_t:r.low*1000,r.high_t!==undefined?r.high_t:r.high*1000)
      +' 元/吨</span>'):'')+'</span></div>';}
  return h;}
function render(d){
  var h='';
  h+='<div class="hd"><h1>成都废料回收报价</h1><div class="d">'
    +esc(d.quote_date)+' · 单价：元/公斤</div><div class="f">更新 '
    +esc(d.fetched_at)+'</div></div>';
  if(d.is_fallback) h+='<div class="warn">当日报价尚未发布，以下为最近一期报价，非今日价。</div>';
  var cu=null, i;
  for(i=0;i<d.sections.length;i++) if(d.sections[i].name==='废铜') cu=d.sections[i];
  if(cu && cu.rows.length){
    h+='<div class="cu"><h2>今日成都废铜回收价</h2>'+rows(cu.rows,false)+'</div>';}
  for(i=0;i<d.sections.length;i++){var s=d.sections[i];
    if(s.name==='废铜'&&cu) continue;
    if(!s.rows || !s.rows.length) continue;
    h+='<div class="card"><div class="sh" style="background:'+s.accent+'"><b>'
      +esc(s.name)+(s.low?'<i style="font-style:normal;font-weight:400;font-size:10px;opacity:.85;margin-left:6px">数值偏低·供参考</i>':'')+'</b><span>'+s.rows.length+' 个品名 · 元/公斤</span></div>'
      +rows(s.rows,true)+'</div>';}
  var sd=d.chengdu||{};
  if((sd.cu&&sd.cu.length)||(sd.steel&&sd.steel.length)){
    h+='<div class="mini"><b>成都现货参考（'+esc(sd.date)+'，元/公斤）</b>';
    if(sd.cu&&sd.cu.length) h+=sd.cu.map(function(p){return esc(p[0])+' '+num(p[1]);}).join(' ｜ ');
    if(sd.steel&&sd.steel.length) h+='<br>废钢：'+sd.steel.map(function(p){
      return esc(p[0])+' '+num(p[1])+' 元/吨';}).join(' ｜ ');
    h+='</div>';}
  var fu=d.futures||[];
  if(fu.length){
    h+='<div class="mini"><b>期货行情参考（现货基准，非废料价）</b><div class="fut">';
    for(i=0;i<fu.length;i++){var f=fu[i];var t,cl;
      if(f.chg===null||f.chg===undefined||isNaN(f.chg)){t='—';cl='fl';}
      else if(f.chg>0){t='▲'+Math.abs(f.pct).toFixed(2)+'%';cl='up';}
      else if(f.chg<0){t='▼'+Math.abs(f.pct).toFixed(2)+'%';cl='dn';}
      else {t='持平';cl='fl';}
      var unit=(f.unit==='克')?'元/克':('元/'+f.unit);
      h+='<div><span>'+esc(f.name)+' '+num(f.last)+'</span><span class="'+cl
        +'" style="font-size:12px">'+t+'</span></div>';}
    h+='</div></div>';}
  h+='<div class="foot">铜 / 铝 / 钢 来源：山东金属网·成都每日报价（实时）；'
    +'不锈钢 / 铁 / 铅 / 锌 / 纸 来源：中国废品网 zgfp.com（数值偏低，仅供参考） ／ 新浪财经<br>'
    +'废料价为厂家挂牌收购区间，实际成交按品相、含量、地区议价。</div>';
  h+='<a class="refresh" href="javascript:location.reload()">刷新报价</a>';
  document.getElementById('app').innerHTML=h;}
function fail(e){
  document.getElementById('app').innerHTML='<div class="warn">暂时取不到今日报价'
    +'（数据服务没响应），请过一会儿刷新本页。<br>'+esc(e)+'</div>';}
// 数据层是 ntfy 的 NDJSON：一行一条消息，取最后一条（最新）解析
fetch(API+(API.indexOf('?')<0?'?':'&')+'_='+Date.now(),{cache:'no-store'})
  .then(function(r){return r.text();})
  .then(function(t){
    var lines=t.split('\n').filter(function(x){return x.trim();});
    if(!lines.length) throw new Error('还没有数据，等明天早上更新');
    var o=JSON.parse(lines[lines.length-1]);
    var d=JSON.parse(o.message);
    render(d);})
  .catch(function(e){ fail(e && e.message ? e.message : e); });
</script></body></html>
